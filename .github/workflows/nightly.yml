name: nightly

# Trino 483 and 484 with the Iceberg connector on top of the PR integration setup (ENGINE-05,
# D9). Only a scheduled failure opens an issue labelled `nightly-failure`, or comments on the open one.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iceberg:
    strategy:
      fail-fast: false
      # Images are pinned to the digest their tag had when it was pinned, like the actions
      # (WR-C06). The `Digest:` line of `docker buildx imagetools inspect trinodb/trino:<tag>`
      # is the value to refresh it with.
      matrix:
        include:
          - trino: "483"
            digest: "sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534"
          - trino: "484"
            digest: "sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      ICEBERG_STATE_NAME: iceberg-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trino }}
      ONTOFORGE_ICEBERG_EVIDENCE_DIR: ${{ github.workspace }}/target/phase072-minio/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.trino }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare private owner state
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/$ICEBERG_STATE_NAME"
          chmod 700 "$RUNNER_TEMP/$ICEBERG_STATE_NAME"
      - name: Complete MinIO contract and regression corpus
        run: ONTOFORGE_ICEBERG_STATE="$RUNNER_TEMP/$ICEBERG_STATE_NAME/state.json" bash ci/iceberg-services.sh nightly --trino "${{ matrix.trino }}"
      - name: Always clean this owner
        if: always()
        run: bash ci/iceberg-services.sh cleanup --state "$RUNNER_TEMP/$ICEBERG_STATE_NAME/state.json"
      - name: Publish scanned evidence to the run log
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["ONTOFORGE_ICEBERG_EVIDENCE_DIR"])
          result_path = evidence / "result.json"
          if result_path.is_file():
              result = json.loads(result_path.read_text())
              names = ["cleanup.json", "result.json"]
              if result.get("scan_passed"):
                  names += ["provenance.json", "counts-before.json", "counts-after.json",
                            "metadata-locations.txt", "metadata-locations-after.txt",
                            "objects-before.json", "objects-after.json", "restart.json",
                            "corpus.json", "iceberg-exact.log", "iceberg-exact-after.log"]
              for name in names:
                  path = evidence / name
                  if path.is_file() and not path.is_symlink():
                      print("ICEBERG_EVIDENCE " + name)
                      print(path.read_text())

  # Only this job may write issues. It checks out nothing and runs no repository code; the
  # test job above keeps the read-only token (E25).
  report-failure:
    needs: iceberg
    if: ${{ github.event_name == 'schedule' && failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The nightly integration workflow failed: $RUN_URL (the run shows which Trino version failed)."
          existing=$(gh issue list --repo "${{ github.repository }}" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh label create nightly-failure --repo "${{ github.repository }}" --color B60205 --description "Nightly workflow failure" || true
            gh issue create --repo "${{ github.repository }}" --title "Nightly integration run failed" --label nightly-failure --body "$body"
          fi
