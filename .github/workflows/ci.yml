name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment is the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.0"
          components: "clippy, rustfmt"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # A second TLS / crypto stack widens the supply chain and makes Linux CI need system
      # headers; postgresql_embedded pulls native-tls unless its default features are off
      # (RESEARCH Pitfall 5). `cargo tree -i` exits non-zero when the package is absent.
      - name: No OpenSSL or native-tls in the dependency graph
        shell: bash
        run: |
          ! cargo tree --workspace --locked --features ontoforge-storage/embedded-pg -e normal,build,dev -i openssl
          ! cargo tree --workspace --locked --features ontoforge-storage/embedded-pg -e normal,build,dev -i native-tls
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Real PostgreSQL + Trino 483 on Linux (ENGINE-05, ADR-0017). The tests are #[ignore]d so
  # that Windows needs no Docker; this job runs them with --ignored.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Container images are pinned to a digest, like the actions to a commit SHA; the tag
        # names the version (WR-C06).
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          # Throwaway password that only exists inside this job's containers.
          POSTGRES_PASSWORD: ontoforge-ci-only
        # Published to the runner so that the host network Trino and the runner's psql can
        # reach localhost:5432 (E25).
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ontoforge-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Seed PostgreSQL from the aviation fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE demo' -c 'CREATE DATABASE editstore'
          psql -v ON_ERROR_STOP=1 -v fixtures="$PWD/examples/ontologies/aviation/bindings/dev/fixtures" -d demo -f ci/pg/seed.sql
      # A service container starts before checkout and cannot mount repository files, so Trino
      # is started here (RESEARCH Pitfall 7).
      - name: Start Trino 483
        run: docker run -d --name trino --network host -v "$PWD/ci/trino/catalog:/etc/trino/catalog:ro" trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
      - name: Wait for Trino
        run: |
          deadline=$((SECONDS + 180))
          until curl -fsS http://localhost:8080/v1/info | jq -e '.starting == false' >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Trino did not finish starting within 180 s"
              docker logs trino
              exit 1
            fi
            sleep 2
          done
          echo "Trino is ready after ${SECONDS} s"
      - name: Engine integration tests
        env:
          ONTOFORGE_TRINO_URL: http://localhost:8080
        run: cargo test -p ontoforge-engine --test trino_it --locked -- --ignored
      - name: CLI integration tests
        env:
          ONTOFORGE_TRINO_URL: http://localhost:8080
        run: cargo test -p ontoforge --test cli_trino_it --locked -- --ignored
      # A green run must not mean "nothing ran" (RESEARCH Pitfall 8).
      - name: Ignored tests are actually there
        run: |
          for target in "ontoforge-engine trino_it" "ontoforge cli_trino_it"; do
            set -- $target
            count=$(cargo test -p "$1" --test "$2" --locked -- --ignored --list | grep -c ': test$' || true)
            echo "$2: $count ignored tests"
            if [ "$count" -eq 0 ]; then
              echo "::error::$2 lists no ignored tests"
              exit 1
            fi
          done
      - name: Trino logs
        if: failure()
        run: docker logs trino
