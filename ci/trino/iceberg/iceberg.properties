# Iceberg catalog of the nightly CI Trino (D9): JDBC catalog in the PostgreSQL database
# `iceberg_catalog` (tables created by ci/pg/iceberg_catalog.sql), warehouse on Trino's local
# file system. Public MinIO images are no longer published, and ontoforge only talks to Trino,
# never to the object store, so a local warehouse exercises the same Iceberg connector without
# another third-party image. The password only exists inside the CI containers.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=ontoforge_ci
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://localhost:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=postgres
iceberg.jdbc-catalog.connection-password=ontoforge-ci-only
iceberg.jdbc-catalog.default-warehouse-dir=local:///warehouse
fs.local.enabled=true
local.location=/tmp/iceberg
