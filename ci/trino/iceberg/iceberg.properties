# JDBC + S3 fixture. The runner injects temporary credentials into a private copy.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=ontoforge_ci
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://localhost:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=postgres
iceberg.jdbc-catalog.connection-password=
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
