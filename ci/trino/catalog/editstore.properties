# Edit store catalog of the CI Trino (used from Phase 3): the PostgreSQL database `editstore`
# on the same instance as `demo`. The password only exists inside the CI containers.
connector.name=postgresql
connection-url=jdbc:postgresql://localhost:5432/editstore
connection-user=postgres
connection-password=ontoforge-ci-only
# Array columns of the edit tables (list properties, Pitfall 7) are skipped by the PostgreSQL
# connector unless arrays are mapped; the reload visibility probe and any reader of those
# columns depend on this. A production catalog over the edit store needs the same setting.
postgresql.array-mapping=AS_ARRAY
# Keep stale table and missing-table metadata long enough to exercise the reload flush.
metadata.cache-ttl=10m
metadata.cache-missing=true
