[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde-saphyr = "2.0"
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.3", features = ["derive", "indexmap2"] }
indexmap = { version = "2.14.2", features = ["serde"] }
thiserror = "2.0.21"
cel = "0.15.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
miette = { version = "7.6.0", features = ["fancy"] }
toml = "1.1.8"
strsim = "0.11.1"
globset = "0.4.20"
walkdir = "2.5.0"
camino = "1.2.6"
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
insta = { version = "1.49.0", features = ["json"] }
jsonschema = { version = "0.58.6", default-features = false }
tempfile = "3.27.0"
heck = "0.5.0"
anstream = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "postgres", "migrate", "macros", "json", "chrono", "tls-rustls-aws-lc-rs"] }
secrecy = "0.10.3"
csv = "1.4.0"
chrono-tz = { version = "0.10.4", default-features = false }
ulid = "3.0.0"
wiremock = "0.6.5"
proptest = "1.12.0"
sqlparser = "0.63.0"
futures-util = { version = "0.3.34", default-features = false }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-postgres", "backend-sqlite", "with-json", "with-chrono", "postgres-array"] }
sea-query-sqlx = { version = "0.9.1", default-features = false, features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "with-json", "with-chrono", "postgres-array"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
getrandom = "0.4.3"
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["tokio", "theseus", "tls-rustls-aws-lc-rs"] }
axum = "=0.8.9"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
utoipa-axum = "=0.3.0"
tokio-util = { version = "0.7.20", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Diagnostic is the error type of the loader; boxing it would only add noise.
result_large_err = "allow"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
