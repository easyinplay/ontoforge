[package]
name = "ontoforge-action"
description = "Action execution and edit log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
embedded-pg = ["ontoforge-storage/embedded-pg"]

[dependencies]
ontoforge-storage = { path = "../ontoforge-storage" }
ontoforge-expr = { path = "../ontoforge-expr" }
ontoforge-schema = { path = "../ontoforge-schema" }
ontoforge-auth = { path = "../ontoforge-auth" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2 = "0.10.9"
indexmap.workspace = true
cel = "0.15.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
camino.workspace = true
sqlx.workspace = true
