[package]
name = "ontoforge"
description = "ontoforge command line: validate and lint ontology-as-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "ontoforge"
path = "src/lib.rs"

[[bin]]
name = "ontoforge"
path = "src/main.rs"

[dependencies]
ontoforge-schema = { path = "../ontoforge-schema" }
ontoforge-expr = { path = "../ontoforge-expr" }
ontoforge-engine = { path = "../ontoforge-engine" }
ontoforge-auth = { path = "../ontoforge-auth" }
ontoforge-storage = { path = "../ontoforge-storage" }
ontoforge-action = { path = "../ontoforge-action" }
ontoforge-server = { path = "../ontoforge-server" }
reqwest.workspace = true
rmcp.workspace = true
clap.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
camino.workspace = true
anstream.workspace = true
tokio = { workspace = true, features = ["signal"] }
ulid.workspace = true
chrono.workspace = true
getrandom.workspace = true

[dev-dependencies]
ontoforge-query = { path = "../ontoforge-query" }
# The end-to-end webhook receiver is an example target, so it stays out of the release
# dependency set (D-01). `axum` is already pinned by the workspace.
axum.workspace = true
insta.workspace = true
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
sqlx.workspace = true
wiremock.workspace = true
