kind: ObjectType
apiName: Flight
primaryKey: flightId
properties:
  flightId: { type: string, required: true }
  status: { type: string }
  delayMinutes: { type: integer }
backing: editOnly
---
kind: ActionType
apiName: renameFlight
parameters:
  flight: { type: { objectReference: Flight }, required: true }
  newId: { type: string, required: true }
rules:
  - kind: modifyObject
    object: flight
    properties:
      flightId: { param: newId }
