kind: ObjectType
apiName: Flight
primaryKey: flightId
properties:
  flightId: { type: string, required: true }
  status: { type: string }
  delayMinutes: { type: integer }
---
kind: ActionType
apiName: markFlight
parameters:
  flight: { type: { objectReference: Flight }, required: true }
  minutes: { type: integer, required: true }
rules:
  - kind: modifyObject
    object: flight
    properties:
      status: { param: minutes }
