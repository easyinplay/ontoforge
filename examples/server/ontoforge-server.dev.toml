# Example server configuration for local development with the aviation example.
#
# It contains no secrets. The SQLite edit store and the development signing key are files below
# `target/ontoforge-dev/`, which git ignores. Nothing needs to exist beforehand: the first
# `ontoforge reload` (or any command that opens the store) creates the store file, the first
# `ontoforge dev-token` creates the key, and the missing directories are created with them.
# Paths are relative to this file. On Windows the key file inherits the ACL of its directory, so
# other local accounts may be able to read it; see "Known gaps" in docs/edit-store.md. Use it with:
#
#   ontoforge reload examples/ontologies/aviation --server-config examples/server/ontoforge-server.dev.toml
#   ontoforge scope plan examples/scopes/aviation --ontology examples/ontologies/aviation \
#       --server-config examples/server/ontoforge-server.dev.toml

[store]
kind = "sqlite"
path = "../../target/ontoforge-dev/editstore.db"

# The attribute `crewScheduler` reads in its row filter (`principal.attrs.homeAirports`).
[auth.principal_attrs.homeAirports]
claim = "airports"
type = "string_list"

[auth.dev]
key_file = "../../target/ontoforge-dev/dev-token.key"
