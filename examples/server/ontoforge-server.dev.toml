# Example server configuration for local development with the aviation example.
#
# It contains no secrets: the SQLite edit store is a file below `target/` (ignored by git) and the
# development signing key is created on first use by `ontoforge dev-token`. Paths are relative to
# this file. Use it with:
#
#   ontoforge reload examples/ontologies/aviation --server-config examples/server/ontoforge-server.dev.toml
#   ontoforge scope plan examples/scopes/aviation --ontology examples/ontologies/aviation \
#       --server-config examples/server/ontoforge-server.dev.toml

[store]
kind = "sqlite"
path = "../../target/ontoforge-dev/editstore.db"

# The attribute `crewScheduler` reads in its row filter (`principal.attrs.homeAirports`).
[auth.principal_attrs.homeAirports]
claim = "airports"
type = "string_list"

[auth.dev]
key_file = "../../target/ontoforge-dev/dev-token.key"
